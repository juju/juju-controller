name: juju-controller
title: Juju Controller Charm
description: |
  The Juju controller charm is used to expose various pieces
  of functionality of a Juju controller.
summary: |
  The Juju controller.
type: charm
links:
  issues:
    - https://github.com/juju/juju-controller/issues
  source:
    - https://github.com/juju/juju-controller

assumes:
  - juju >= 4.2

provides:
  dashboard:
    interface: juju-dashboard
    optional: true
  website:
    interface: http
    optional: true
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true

requires:
  charm-tracing:
    interface: tracing
    limit: 1
    optional: true
  charm-tracing-ca-cert:
    interface: certificate_transfer
    limit: 1
    optional: true
  workload-tracing:
    interface: tracing
    limit: 1
    optional: true
  workload-tracing-ca-cert:
    interface: certificate_transfer
    limit: 1
    optional: true
  s3-backend:
    interface: s3
    limit: 1
    optional: true
  loki-push-api:
    interface: loki_push_api
    limit: 1
    optional: true
  loki-push-api-ca-cert:
    interface: certificate_transfer
    limit: 1
    optional: true

peers:
  dbcluster:
    interface: dbcluster

parts:
  charm:
    plugin: uv
    source: .
    build-packages: [git]
    build-snaps: [astral-uv]

platforms:
  ubuntu@22.04:amd64:
  ubuntu@22.04:arm64:
  ubuntu@22.04:s390x:
  ubuntu@22.04:ppc64el:
  ubuntu@24.04:amd64:
  ubuntu@24.04:arm64:
  ubuntu@24.04:s390x:
  ubuntu@24.04:ppc64el:
  ubuntu@24.04:riscv64:
  ubuntu@26.04:amd64:
  ubuntu@26.04:arm64:
  ubuntu@26.04:s390x:
  ubuntu@26.04:ppc64el:
  ubuntu@26.04:riscv64:

charm-libs:
  - lib: prometheus_k8s.prometheus_scrape
    version: "0"
  - lib: tempo_coordinator_k8s.tracing
    version: "0"
  - lib: certificate_transfer_interface.certificate_transfer
    version: "1"
  - lib: data_platform_libs.s3
    version: "0"
  - lib: loki_k8s.loki_push_api
    version: "1"

config:
  options:
    controller-url:
      default: ""
      description: The URL used to access the controller API.
      type: string
    identity-provider-url:
      default: ""
      description: The URL used to access an external identity provider.
      type: string
    is-juju:
      default: true
      description: Whether this is a standalone Juju controller
      type: boolean
    workload-tracing-stack-traces:
      default: false
      description: Whether stack traces should be added per workload tracing span.
      type: boolean
    workload-tracing-sample-ratio:
      default: 0.1
      description: The workload tracing sampling ratio (must be between 0 and 1).
      type: float
    workload-tracing-tail-sampling-threshold:
      default: "1ms"
      description: The workload tracing tail sampling threshold as a duration string.
      type: string
    workload-tracing-insecure-skip-verify:
      default: false
      description: Whether workload tracing should skip TLS certificate verification.
      type: boolean
    loki-insecure-skip-verify:
      default: false
      description: Whether Loki should skip TLS certificate verification.
      type: boolean
    loki-org-id:
      default: ""
      description: The Loki organization ID to use when pushing logs.
      type: string
