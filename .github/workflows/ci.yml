name: "CI"
# We don't run this workflow on 'pull_request', because we require secrets to
# upload the charm to Charmhub, and pull_request runs can't access secrets.
# PRs should be opened from a branch on the main juju/juju-controller repo,
# not from a fork.
on:
  push:
  workflow_dispatch:
env:
  CHARM_NAME: ${{ vars.CHARM_NAME }}

jobs:

  check:
    name: Lint and run unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    container:
      image: python:${{ matrix.python }}
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Run lint
      run: make lint

    - name: Run unit tests
      run: make unit

  build:
    name: Build charm
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee  # 1.0.0

      - name: Add runner to lxd group
        run: |
          sudo usermod -a -G lxd $USER
          newgrp lxd

      - name: Install charmcraft
        # We use latest because there's no 4.x track yet.
        run: sudo snap install charmcraft --classic --channel=latest/stable

      - name: Pack charm
        run: sg lxd -c "charmcraft pack"

      - name: Upload charm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: charm
          path: "*.charm"

  channel:
    name: Select Charmhub channel
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.channel.outputs.test }}
      release: ${{ steps.channel.outputs.release }}

    steps:
    - name: Select Charmhub channel
      id: channel
      shell: bash
      run: |
        set -eux
        case ${{ github.ref_name }} in
          3.* | 4.*)
            TRACK=$(echo "${{ github.ref_name }}" | awk -F "-" '{print $1}')
            DO_RELEASE=true
            ;;
          main)
            TRACK="latest"
            DO_RELEASE=true
            ;;
          *)
            TRACK="latest"
            DO_RELEASE=false  # Don't release feature branches
            ;;
        esac

        # Feature branches will be released to the 'latest' track, so we need
        # to include the branch name to disambiguate.
        BRANCH="${{ github.ref_name }}-${{ github.sha }}"

        echo "test=$TRACK/edge/$BRANCH" >> "$GITHUB_OUTPUT"
        if [[ "$DO_RELEASE" == 'true' ]]; then
          echo "release=$TRACK/edge" >> "$GITHUB_OUTPUT"
        fi


  upload:
    name: Upload to Charmhub
    needs: [build, channel]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download packed charm
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: charm

      - name: Upload charms to Charmhub
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
        run: |
          # We use latest because there's no 4.x track yet.
          sudo snap install charmcraft --channel latest/stable --classic
          for FILE in *.charm; do
            echo "Uploading: $FILE"
            charmcraft upload --name "$CHARM_NAME" --release "${{ needs.channel.outputs.test }}" "$FILE" 
          done


  integration:
    name: Integration tests (${{ matrix.test_name }})
    runs-on: ubuntu-latest
    needs: [build, upload, channel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: lxd-22.04
            cloud: lxd
            bootstrap_base: ubuntu@22.04
          - test_name: lxd-24.04
            cloud: lxd
            bootstrap_base: ubuntu@24.04
          - test_name: lxd-26.04
            cloud: lxd
            bootstrap_base: ubuntu@26.04
          - test_name: microk8s
            cloud: microk8s
            bootstrap_base: ubuntu@24.04
          - test_name: k8s
            cloud: k8s
            bootstrap_base: ubuntu@24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install concierge
      run: sudo snap install --classic concierge

    - name: Prepare with concierge
      run: sudo concierge prepare -v -c ".github/concierge-${{ matrix.cloud }}.yaml"

    - name: Bootstrap on LXD
      if: matrix.cloud == 'lxd'
      # Concierge's LXD provider registers Juju's "localhost" cloud.
      run: |
        juju bootstrap localhost "lxd" \
          --bootstrap-base=${{ matrix.bootstrap_base }} \
          --controller-charm-channel=${{ needs.channel.outputs.test }}

    - name: Bootstrap on MicroK8s
      if: matrix.cloud == 'microk8s'
      run: |
        juju bootstrap microk8s "microk8s" \
          --controller-charm-channel=${{ needs.channel.outputs.test }}

    - name: Bootstrap on Canonical k8s
      if: matrix.cloud == 'k8s'
      run: |
        juju bootstrap k8s "k8s" \
          --controller-charm-channel=${{ needs.channel.outputs.test }}

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Run integration tests
      # Make sure we switch to the bootstrapped controller.
      run: |
        juju switch "${{ matrix.cloud }}:"
        make integration

    - name: Get Juju info for debugging
      if: failure()
      run: |
        set -x
        set +e
        juju status -m controller
        juju debug-log -m controller --replay

    - name: Get MicroK8s pod info for debugging
      if: failure() && matrix.cloud == 'microk8s'
      run: |
        sg snap_microk8s <<EOF
          microk8s.kubectl -n controller-microk8s get all
          microk8s.kubectl -n controller-microk8s get -o yaml pod/controller-0
        EOF

    - name: Get Canonical K8s pod info for debugging
      if: failure() && matrix.cloud == 'k8s'
      run: |
        sudo k8s kubectl -n controller-k8s get all
        sudo k8s kubectl -n controller-k8s get -o yaml pod/controller-0

    # TODO: test integration with dashboard / ha-proxy
