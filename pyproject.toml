[project]
name = "juju-controller"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ops~=3.8",
    "cosl",
]

[dependency-groups]
dev = [
    "codespell",
    "coverage",
    "pyright",
    "ruff",
]
integration = [
    "jubilant",
    "pytest",
]

# Configure Jubilant logs for integration tests
# https://canonical.com/juju/docs/ops/latest/howto/write-integration-tests-for-a-charm/#example-of-brief-logging
[tool.pytest.ini_options]
log_cli_format = "%(levelname)s %(name)s %(message)s"

[tool.ruff]
target-version = "py310"
line-length = 99
extend-exclude = [
    ".venv",
    ".git",
    "build",
    "dist",
    "*.egg_info",
    "lib",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E", "W", "F", "C901", "N",
    "unsorted-imports",  # I001
    "UP",  # Upgrade Python syntax
]
ignore = [
    # This rule wants exception classes to be named with an "Error"
    # suffix. This repo widely uses the "Exception" suffix.
    # We ignore it rather than renaming all of them.
    "N818",  # error-suffix-on-exception-name
]

[tool.pyright]
pythonVersion = "3.10"
reportUnnecessaryTypeIgnoreComment = "error"
include = ["src", "tests"]

[tool.codespell]
skip = "build,lib,.venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage"
